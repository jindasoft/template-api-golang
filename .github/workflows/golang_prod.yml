name: Golang GitOps (prod)

on:
  push:
    tags:
      - 'v*'

jobs:
  uses_workflow_call:
    permissions:
      packages: write
      contents: read
      id-token: write
    uses: jindasoft/jinda-platform-ghac/.github/workflows/golang_gitops_prod.yml@v0.1.0
    with:
      gitops_repo: <GITHUB_ORG>/<GITOPS_REPO_NAME>
      artifact_registry: <GCP_PROJECT_ID>/<GCP_ARTIFACT_REPOSITORY>
    secrets:
      ci_token: ${{ secrets.TGR_CI_TOKEN }}
      cd_token: ${{ secrets.TGR_CD_TOKEN }}
      gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
