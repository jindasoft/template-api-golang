name: Golang GitOps (dev)

on:
  push:
    branches:
      - develop

jobs:
  uses_workflow_call:
    permissions:
      packages: write
      contents: read
    uses: jindasoft/jinda-platform-ghac/.github/workflows/golang_gitops_dev.yml@v0.1.0
    with:
      gitops_repo: <GITHUB_ORG>/<GITOPS_REPO_NAME>
    secrets:
      ci_token: ${{ secrets.GITOPS_CI_TOKEN }}
      cd_token: ${{ secrets.GITOPS_CD_TOKEN }}
